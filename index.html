mns:repeat(2,1fr);gap:10px}.photo-tile{border:0;border-radius:14px;padding:12px;text-align:left;min-height:135px;background:linear-gradient(130deg,#ddd9d0,#f5f3e8);color:#41535a;display:flex;flex-direction:column;justify-content:flex-end}.photo-tile:nth-child(2){background:linear-gradient(120deg,#d3d8d4,#9fa9a3)}.photo-tile:nth-child(3){background:linear-gradient(110deg,#c9c8be,#e6dcca)}.photo-tile b{font-size:14px}.photo-tile span{font-size:11px}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:7px}.hero{width:100%;border-radius:15px;max-height:230px;object-fit:cover;object-position:50% 28%;margin:2px 0 9px}.clue{background:#e9efeb;border-radius:12px;padding:12px;font-size:13px;line-height:1.7;margin:10px 0}.stamp{display:inline-block;border:1px solid #aac2bd;border-radius:20px;padding:2px 9px;color:#52746f;font-size:11px}.end{background:#13262a;color:#f2f3eb;border-radius:18px;padding:23px;line-height:1.8;white-space:pre-line}.end h2{font-size:20px}.end small{color:#adc1bb}.credits{font-size:11px;color:#8a9691;line-height:1.6;margin-top:16px}input[type=file]{width:100%;font-size:13px}.preview{width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin:9px 0}.darkmsg{color:#738285;font-size:12px;text-align:center;padding:18px}

<body><div class="shell"><div class="status"><span>21:14　◖◖</span><span>4G ▰ 78%</span></div><header class="head"><div class="eyebrow" id="eyebrow">PHONE ARCHIVE · 2026</div><h1 id="title">到家了嗎？</h1><p id="subtitle">她的手機仍然有人在等回覆。</p></header><main class="main" id="main"></main><nav class="tabs"><button data-action="home">⌂　桌面</button><button data-action="clues">▤　線索</button><button data-action="restart">↺　重來</button></nav><section class="overlay" id="overlay"><div class="overlay-head"><button class="back" data-action="close" aria-label="返回">‹</button><strong id="overlayTitle"></strong></div><div class="overlay-content" id="overlayContent"></div></section></div>
<script>
/* Fictional prototype. No network requests, analytics or real uploads. */
const KEY='after_read_v01';
const fresh=()=>({act:1,seen:{},solved:{},replied:{},choices:{},photo:false,photoDeclined:false,ending:null,notes:[]});
let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{s=fresh()}
let photoPreview='';let view='home';
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(who,msg,mine=false,cls='')=>`<div class="line ${mine?'mine':''} ${cls}"><span class="who">${esc(who)}</span>${esc(msg)}</div>`;
const date=t=>`<div class="thread-date">${esc(t)}</div>`;
const clue=(text)=>`<div class="clue">${text}</div>`;
const acts={
1:{name:'第一張照片',date:'2026 年 6 月 18 日',intro:'她在 2025 年底離開。半年後，阿姨將她的手機交給你。你沒有刪掉任何東西。',goal:'先查看「訊息」和「小房間」，再從相簿找出她回家後固定拍的那一天。',apps:['messages','idol','gallery','unknown']},
2:{name:'週末借我一下',date:'2026 年 6 月 19 日',intro:'你醒來第一件事，是確認那個沒有大頭貼的帳號有沒有再說話。',goal:'對照訊息、行事曆與相簿，找出她說要休息，卻仍出現在活動現場的日期。',apps:['messages','calendar','gallery','unknown']},
3:{name:'給我一張今天的照片',date:'2026 年 6 月 21 日',intro:'偶像、團體和無頭貼帳號看起來是三件不同的事。至少目前是。',goal:'比較偶像訊息與公開粉絲截圖，再閱讀她留下的草稿。照片要求會在調查後出現。',apps:['idol','social','notes','unknown']},
4:{name:'沒有大頭貼的人',date:'2026 年 6 月 22 日',intro:'現在你已經知道，每一則「我擔心你」背後都有一個在等她完成的工作。',goal:'查完 2025 年底的紀錄，拼出無頭貼帳號由誰使用，再決定怎麼處理證據。',apps:['messages','gallery','notes','idol','unknown']}
};
const appMeta={messages:['訊息','聊天紀錄','✉'],idol:['小房間','偶像訂閱','♡'],gallery:['相簿','照片與資訊','▦'],unknown:['沒有大頭貼','仍在傳訊息','◌'],calendar:['行事曆','日期與行程','▣'],social:['社群','公開貼文','◎'],notes:['備忘錄','未送出的話','▤']};
const required={1:['messages','idol','gallery'],2:['messages','calendar','gallery'],3:['idol','social','notes'],4:['messages','gallery','notes','idol']};
function mark(app){s.seen[`${s.act}:${app}`]=true;save()}
function seen(app){return !!s.seen[`${s.act}:${app}`]}
function ready(){return required[s.act].every(seen)}
function addNote(t){if(!s.notes.includes(t))s.notes.push(t)}
function render(){const a=acts[s.act];$('eyebrow').textContent=`第 ${s.act} 幕 / 四幕　·　${a.date}`;$('title').textContent=s.ending?'到家了嗎？':a.name;$('subtitle').textContent=s.ending?'一個故事有兩種留下的方法。':a.intro;
let h=`<div class="actbar">${[1,2,3,4].map(i=>`<span class="${i<=s.act?'on':''}"></span>`).join('')}</div>`;
if(s.ending){h+=endingHTML();$('main').innerHTML=h;return}
h+=`<div class="notice"><b>目前要做的事</b>${a.goal}</div><div class="section">手機 App</div><div class="apps">${a.apps.map(id=>{let m=appMeta[id];return `<button class="app" data-app="${id}"><span class="icon">${m[2]}</span><span><strong>${m[0]}${id==='unknown'&&!s.replied[s.act]?'<i class="dot">1</i>':''}</strong><small>${seen(id)?'已查看':m[1]}</small></span></button>`}).join('')}</div>`;
h+=progressHTML();$('main').innerHTML=h}
function progressHTML(){let h='<div class="section">調查進度</div><div class="card">';
if(s.act===1){h+=`<h3>哪張照片讓你停下來？</h3><p>訊息裡提到她從 11 月 16 日開始，每晚傳一張到家照片。從相簿找出第一張。</p>`;if(ready()&&!s.solved[1])h+=puzzle([['11 月 06 日','a1bad'],['11 月 16 日','a1good'],['12 月 16 日','a1bad']]);else if(!ready())h+=`<p class="muted">先打開訊息、小房間與相簿。</p>`}
if(s.act===2){h+=`<h3>哪個週末對不上？</h3><p>她說要把星期六留給自己。找出「請假」卻又在活動照裡出現的日期。</p>`;if(ready()&&!s.solved[2])h+=puzzle([['2025／08／02','a2bad'],['2025／08／09','a2good'],['2025／08／16','a2bad']]);else if(!ready())h+=`<p class="muted">查看訊息、行事曆與相簿。</p>`}
if(s.act===3){h+=`<h3>那句話是專門回她的嗎？</h3><p>比對偶像 App 與公開粉絲貼文。</p>`;if(ready()&&!s.solved[3])h+=puzzle([['是，他記得她的每一句話','a3bad'],['不是，同一句傳給很多訂閱者','a3good']]);else if(!ready())h+=`<p class="muted">查看小房間、社群與備忘錄。</p>`}
if(s.act===4){h+=`<h3>把兩條證據接起來</h3><p>一條證明她被要求做什麼；一條證明誰在使用無頭貼帳號。</p>`;if(ready()&&!s.solved[4])h+=puzzle([['工作排程表 ＋ 帳號登入紀錄','a4good'],['偶像自拍 ＋ 粉絲留言','a4bad'],['她的合照 ＋ 天氣預報','a4bad']]);else if(!ready())h+=`<p class="muted">先查看訊息、相簿、備忘錄與小房間。</p>`}
if(s.solved[s.act]){h+=clue(s.act===1?'找到 11 月 16 日那張照片。接著查看「沒有大頭貼」的新訊息。':s.act===2?'兩份紀錄在同一天。現在可以回覆無頭貼帳號。':s.act===3?'她收到的安慰是真的；「獨一無二的回覆」卻是錯覺。看看新訊息。':'證據已連成一條線。最後讀一次新訊息。');if(!s.replied[s.act])h+=`<button class="primary" data-app="unknown">打開新訊息</button>`;else if(s.act<4)h+=`<button class="primary" data-action="next">進入第 ${s.act+1} 幕</button>`;else h+=endingChoices()}
h+='</div>';return h}
function puzzle(opts){return opts.map(([t,id])=>`<button class="option" data-puzzle="${id}">${t}</button>`).join('')}
function endingChoices(){return `<p>你可以將原始證據交給她信任的人，或只留下自己那一份。兩種結局都會讓故事結束。</p><button class="option" data-end="witness">把紀錄交給阿姨和同事，一起留下證言</button><button class="option" data-end="silence">照對方要求刪除備份，留下她的私人語音</button>`}
function openApp(app){if(!acts[s.act].apps.includes(app))return;mark(app);$('overlayTitle').textContent=appMeta[app][0];$('overlayContent').innerHTML=content(app);$('overlay').classList.add('open');$('overlayContent').scrollTop=0;render()}
function close(){ $('overlay').classList.remove('open');render() }
function content(app){const n=s.act;switch(app){case 'messages':return messages(n);case 'idol':return idol(n);case 'gallery':return gallery(n);case 'unknown':return unknown(n);case 'calendar':return calendar();case 'social':return social();case 'notes':return notes(n)}return ''}
function messages(n){if(n===1)return `<div class="card"><img class="hero" src="assets/owner.jpg" alt="手機主人生活照"><b>聊天：你與小芸</b><span class="muted">你的朋友，2025 年底離開</span></div>${date('2025／12／22')}${L('你','妳又整個週末不見了喔？',false)}${L('小芸','被抓去幫忙啦。等忙完跟妳講。',true)}${L('你','記得吃飯。')}${L('小芸','好啦哈哈。',true)}${date('2025／11／16')}${L('阿芸｜曉雯','妳說有人擔心妳一個人住，回家都要傳照？也太像打卡。')}${L('小芸','11/16 開始的。就玄關而已，沒拍到我啦。',true)}${clue('線索：第一次固定傳「到家照片」是 2025 年 11 月 16 日。')}`;
if(n===2)return `<div class="card"><img class="hero" src="assets/coworker.jpg" alt="同事曉雯"><b>曉雯｜同事</b></div>${date('2025／08／08')}${L('小芸','明天真的不去了。我已經說要休息。',true)}${L('曉雯','好，星期六當妳自己的。')}${date('2025／08／11')}${L('曉雯','妳不是說沒去？我看到活動照裡有妳欸。')}${L('小芸','我只是去幫一下忙。',true)}<div class="card"><img class="avatar" src="assets/friend.jpg" alt="阿哲"><b>阿哲｜大學朋友</b></div>${date('2025／08／13')}${L('阿哲','我每次問妳最近好不好，妳都先說「他們很需要我」。我是問妳。')}${L('小芸','我知道。下次跟你說。',true)}${clue('線索：她拒絕了 8 月 9 日的活動，卻又出現在照片裡。')}`;
return `<div class="card"><img class="avatar" src="assets/member.jpg" alt="團體成員采恩"><b>小組聊天｜微光之家</b><span class="muted">匯出的 2025 年紀錄</span><br><img class="avatar" src="assets/leader.jpg" alt="帶領者郁婷"><span class="muted">帶領者郁婷</span></div>${date('2025／12／18')}${L('采恩｜成員','小芸連續三週都在改活動圖，我可以接她一半。')}${L('郁婷｜帶領者','她做得比較熟，現在換人會亂。先把今晚的貼文交了。')}${L('小芸','我明天上班，可能來不及。',true)}${L('郁婷','妳以前說，這裡是妳的家。家裡需要妳的時候，我希望妳也在。',false,'warn')}${date('2025／12／27')}${L('曉雯','我會過去找妳。妳不用把所有事講清楚才可以找人陪。')}${L('小芸','我看到訊息了。謝謝。',true)}${clue('她最後幾天有人試著接近她。聊天紀錄無法替她解釋所有感受。')}`}
function idol(n){let base=`<div class="card"><img class="hero" src="assets/idol.jpg" alt="偶像訂閱頁面"><b>予安｜小房間</b><br><span class="stamp">訂閱已於 2026／01 結束 · 舊訊息可讀</span></div>`;
if(n===1)return base+date('2023／05／04')+L('予安','今天也有好好吃飯嗎？')+L('小芸','有。雖然是便利商店，但有吃。',true)+date('2023／05／05')+L('予安','一個人吃，也要挑自己喜歡的東西喔。')+L('小芸','你每次都在我快睡的時候出現。',true)+date('2024／03／11')+L('予安','如果今天有人說你做得很好，就相信他一次。')+L('小芸','我想試試看。',true)+`<p class="hint">這些是訂閱期間留在手機上的舊訊息，現在不能再回覆。</p>`;
if(n===3)return base+date('2025／06／14')+L('小芸','我不去週末活動可以嗎？我真的累了。',true)+date('2025／06／15')+L('予安','你不用一個人撐著。我知道你很努力。')+L('小芸','我以為你看到我說的。',true)+clue('記住偶像 6 月 15 日的原句，到社群搜尋當天其他粉絲的貼文。');
return base+date('2025／12／09')+L('予安','謝謝每個讓這次活動順利的人。')+date('2025／12／10')+L('小芸','原來現場那一張圖最後有用上。',true)+`<div class="card"><h3>2025 年會員活動照片</h3><p>予安與「微光之家」幾位成員站在同一張合照裡。這張照片只證明他出席過活動，還不能證明誰在私訊小芸。</p></div>`}
function gallery(n){if(n===1)return `<div class="card"><h3>最近項目 · 已封存</h3><p>點開照片，查看日期與拍攝備註。</p><div class="photo-row"><button class="photo-tile" data-photo="g1a"><b>便利商店晚餐</b><span>2025／11／06</span></button><button class="photo-tile" data-photo="g1b"><b>玄關與門縫</b><span>2025／11／16</span></button><button class="photo-tile" data-photo="g1c"><b>樓梯口的雨傘</b><span>2025／12／16</span></button><button class="photo-tile" data-photo="g1d"><b>沒有傳出的照片</b><span>2025／12／27</span></button></div></div>`;
if(n===2)return `<div class="card"><h3>活動照片 · 2025 年 8 月</h3><div class="photo-row"><button class="photo-tile" data-photo="g2a"><b>關門的咖啡店</b><span>08／02 · 18:42</span></button><button class="photo-tile" data-photo="g2b"><b>桌上三十張名牌</b><span>08／09 · 18:42</span></button><button class="photo-tile" data-photo="g2c"><b>巷口的花</b><span>08／16 · 18:42</span></button></div></div>${clue('08／09 的桌面角落有小芸的工作證；那天她說過自己不去了。')}`;
return `<div class="card"><h3>已刪除 · 最近從備份還原</h3><div class="photo-row"><button class="photo-tile" data-photo="g4a"><b>活動排程表</b><span>2025／12／19</span></button><button class="photo-tile" data-photo="g4b"><b>電腦登入紀錄</b><span>2025／12／24</span></button></div></div>${clue('照片資訊顯示兩張都是小芸自己拍的。她曾經準備留下證據。')}`}
function calendar(){return `<div class="card"><h3>2025 年 8 月</h3><p>08／02　下班後買底片</p><p><b>08／09　私人休息日</b>　<span class="muted">小芸自行新增</span></p><p>08／09　18:00　微光之家活動收場　<span class="muted">由郁婷邀請；接受時間 08／09 10:13</span></p><p>08／16　阿姨家吃飯</p></div>${clue('她已經留了休息日，活動卻又被塞進同一天。')}`}
function social(){return `<div class="card"><h3>公開粉絲貼文 · 2025／06／15</h3><p>粉絲 A：「昨天說工作好累，今天剛好收到予安：『你不用一個人撐著。我知道你很努力。』哭了。」</p><p>粉絲 B：「我也是同一句！真的很會挑時間發訊息🥲」</p><p class="muted">截圖中的發送時間一致：21:17。</p></div><div class="card"><h3>小芸的公開頁面</h3><p>她拍過路上的貓、下班的天空，也分享過活動成果。2025 年底的貼文幾乎都只有「今天也很充實」。</p></div>`}
function notes(n){if(n===3)return `<div class="card"><img class="avatar" src="assets/aunt.jpg" alt="小芸的阿姨"><b>與阿姨的備忘</b><p>小芸與阿姨偶爾吃飯；她沒有父母，但仍有人願意接她的電話。</p></div><div class="card"><h3>草稿 · 未送出</h3><p>「予安說我很努力。也許他根本不知道我在做什麼。可是我一想到要退出，就覺得自己連這裡都沒了。」</p><p>「郁婷說可以把心裡不舒服的地方寫下來，下次一起看。我寫了三次，後來每次都變成我應該怎麼調整自己。」</p><p>「曉雯問我好不好。我很想說不好。」</p></div>`;
return `<div class="card"><h3>草稿 · 2025／12／25</h3><p>「他們說不要把聊天給別人看，因為外面的人不懂。我其實也不確定自己懂不懂。」</p><p>「如果有人看到這裡，請先去找曉雯。還有，別把我的全部人生都寫成這件事。」</p></div><div class="card"><h3>匯出檔說明</h3><p>小芸把活動排程表和帳號登入紀錄拍進了相簿，沒有寄出去。</p></div>`}
function unknown(n){if(!s.solved[n])return `<div class="darkmsg">最新訊息還在通知裡。<br>先把這一幕的線索對起來，再決定怎麼回。</div>`;
let base=`<div class="card"><b>◌　未設定大頭貼</b><br><span class="muted">這個帳號一直沒有顯示姓名</span></div>`;
if(n===1)base+=date('2025／11／16')+L('小芸','到家了。［玄關照片］',true)+L('◌','好，早點睡。')+date('2025／11／21')+L('◌','昨天忘了？')+L('小芸','對不起，太累睡著了。',true)+L('◌','沒關係。我只是會擔心。')+date('2026／06／18')+L('◌','到家了嗎？');
if(n===2)base+=date('2026／06／19')+L('◌','早安。昨天睡得好嗎？')+L('◌','明天的活動不用妳做圖了。有人接手。');
if(n===3)base+=date('2026／06／21')+L('◌','今天可以給我一張照片嗎？隨便什麼都好。')+L('◌','我想知道妳現在願意留下什麼。');
if(n===4)base+=date('2026／06／22')+L('◌','妳把舊照片都看完了吧。')+L('◌','我知道現在拿手機的不是小芸。')+L('◌','她留下的東西，你打算給誰看？');
if(!s.replied[n]){if(n===3){base+=`<div class="card"><h3>選一張照片</h3><p>你可以從自己的裝置選照片，也可以不提供。選的照片只留在此頁面，不會傳出去；對方回覆是預先寫好的通用文字。</p><input type="file" id="photoInput" accept="image/*"><div id="localPreview"></div><button class="option" data-choice="3:photo">選好照片，送出</button><button class="option" data-choice="3:decline">我不想傳照片</button></div>`}else{let opts=n===1?['到了。','今天有點晚。','嗯，怎麼了？']:n===2?['誰接手？','好。','明天是什麼活動？']:['我會把紀錄留下來。','你到底是誰？','我想知道你做了什麼。'];base+=`<div class="card"><h3>你的回覆</h3>${opts.map((o,i)=>`<button class="option" data-choice="${n}:${i}">${o}</button>`).join('')}</div>`}}
else{base+=L('你（以小芸身分）',s.choices[n],true);let reply=n===1?'那就好。今天不用拍門口了。':n===2?'她終於肯讓妳休息一天了。這是好事，對吧？':n===3?(s.photoDeclined?'沒關係。我會等妳願意的時候。':'這張我喜歡。謝謝妳把今天留給我。'):'那你應該也看見了，我們每個人都曾經用這個帳號。予安也用過。不是每一句話都出自同一個人。';base+=L('◌',reply)}
return base}
function showPhoto(id){let d={g1a:['2025／11／06','一份晚餐；傳給同事說「今天終於準時下班」。'],g1b:['2025／11／16','第一張玄關照片。21:48 傳給無頭貼帳號。'],g1c:['2025／12／16','一個月後仍在拍；門口已經沒有她的雨傘。'],g1d:['2025／12／27','拍了，沒有送出。手機的最後一張玄關照片。'],g2a:['2025／08／02','休息日，咖啡店沒有營業。'],g2b:['2025／08／09','工作證露出一角。她說不去，最後仍幫忙做到 18:42。'],g2c:['2025／08／16','路邊花；不是活動現場。'],g4a:['2025／12／19','排程表寫著：小芸／設計、主持、招募、假日值班；薪資欄空白。'],g4b:['2025／12／24','無頭貼帳號的共享裝置清單：郁婷、采恩、予安。不同日期的登入時間對得上聊天。']}[id];if(!d)return;let p=$('overlayContent');p.insertAdjacentHTML('beforeend',`<div class="card"><h3>照片資訊 · ${d[0]}</h3><p>${d[1]}</p></div>`);p.scrollTop=p.scrollHeight}
function reply(act,value){if(!s.solved[act]||s.replied[act])return;
if(act===3){if(value==='photo'){let input=$('photoInput');if(!input||!input.files||!input.files[0]){alert('請先選照片，或選擇不傳。');return}s.photo=true;s.photoDeclined=false;s.choices[3]='［傳送一張照片］'}else{s.photoDeclined=true;s.choices[3]='今天不想拍。'}}else{s.choices[act]=act===1?['到了。','今天有點晚。','嗯，怎麼了？'][+value]:act===2?['誰接手？','好。','明天是什麼活動？'][+value]:['我會把紀錄留下來。','你到底是誰？','我想知道你做了什麼。'][+value]}
s.replied[act]=true;save();$('overlayContent').innerHTML=unknown(act);$('overlayContent').scrollTop=$('overlayContent').scrollHeight;render()}
function endingHTML(){let witness=s.ending==='witness';return `<div class="end"><small>結局 ${witness?'一｜有人留下':'二｜只有你記得'}</small><h2>${witness?'她不需要再一個人解釋':'最後一則未讀訊息'}</h2>${witness?`你把小芸拍下的排程表與登入紀錄交給曉雯和阿姨。你們保留原檔，遮掉她不想公開的私人訊息，一起尋求協助。\n\n事情沒有在一夜之間得到答案。有人仍說她是自願的；曉雯則拿出她曾經說「我想休息」的紀錄。\n\n小芸的相簿最上方，是一張她自己拍的下班天空。阿姨說：「這張她一定喜歡。」\n\n無頭貼最後傳來：『早安。』你沒有替小芸回覆。`: `對方提出交換：刪掉備份，就把小芸最後留下的私人語音給你。你照做了。\n\n語音裡，她只是說今天下班看見一隻很像麵包的狗，笑了好久。你反覆聽，終於聽見她仍有自己的生活。\n\n幾天後，同事問你有沒有找到她曾提過的排程表。你想說有，卻已經沒有檔案能給她看。\n\n無頭貼又傳來：『到家了嗎？』你把手機扣在桌面上。`}</div><p class="credits">四幕試作結束。可從下方「重來」體驗另一個選擇。所有角色與 App 皆為虛構；照片選取只在你的裝置瀏覽器內處理。</p>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action],[data-app],[data-puzzle],[data-photo],[data-choice],[data-end]');if(!t)return;
if(t.dataset.app){openApp(t.dataset.app);return}
if(t.dataset.photo){showPhoto(t.dataset.photo);return}
if(t.dataset.puzzle){let v=t.dataset.puzzle,act=+v[1];if(v.endsWith('good')){s.solved[act]=true;addNote(['','11/16 是第一張到家照片。','8/09 是她拒絕後仍到場的週末。','偶像 6/15 的話是發給多人的訂閱訊息。','無頭貼是共享帳號，包含偶像予安的登入。'][act]);save();render();if($('overlay').classList.contains('open'))close();$('main').scrollTop=$('main').scrollHeight}else{t.textContent='不太對，再對照日期與內容。';t.disabled=true}return}
if(t.dataset.choice){let [a,v]=t.dataset.choice.split(':');reply(+a,v);return}
if(t.dataset.end){s.ending=t.dataset.end;save();render();$('main').scrollTop=0;return}
if(t.dataset.action==='close'||t.dataset.action==='home'){close();view='home';return}
if(t.dataset.action==='next'){if(!s.replied[s.act]||s.act>=4)return;s.act++;save();close();$('main').scrollTop=0;render();return}
if(t.dataset.action==='clues'){$('overlayTitle').textContent='調查手記';$('overlayContent').innerHTML=`<div class="card"><h3>已確認的事</h3>${s.notes.length?s.notes.map(x=>`<p>• ${esc(x)}</p>`).join(''):'<p>你還沒有把任何線索接起來。</p>'}<p class="muted">手機中的 2023–2025 年是舊紀錄；2026 年的無頭貼訊息可以回覆。</p></div>`;$('overlay').classList.add('open');return}
if(t.dataset.action==='restart'){if(confirm('要從第一幕重新開始嗎？目前進度會清除。')){s=fresh();photoPreview='';save();close();$('main').scrollTop=0;render()}}});
document.addEventListener('change',e=>{if(e.target.id!=='photoInput')return;let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){alert('請選擇圖片檔。');return}if(photoPreview)URL.revokeObjectURL(photoPreview);photoPreview=URL.createObjectURL(f);$('localPreview').innerHTML='<img class="preview" alt="本機照片預覽"><p class="muted">僅在目前頁面預覽，重新整理後照片不會保存。</p>';$('localPreview').querySelector('img').src=photoPreview});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
